<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Connexion - FoodApp</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h2>🍔 Connexion</h2>
    <div th:if="${param.error}" class="alert alert-error">Email ou mot de passe incorrect.</div>
    <div th:if="${param.logout}" class="alert alert-success">Vous êtes déconnecté.</div>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="username" required placeholder="votre@email.com">
        </div>
        <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" name="password" required placeholder="••••••">
        </div>
        <button type="submit" class="btn-primary btn-full">Se connecter</button>
    </form>
    <p class="auth-link">Pas encore inscrit ? <a th:href="@{/register}">S'inscrire</a></p>
</div>
</body>
</html>

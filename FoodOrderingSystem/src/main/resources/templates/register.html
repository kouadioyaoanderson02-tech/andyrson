<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inscription - FoodApp</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<div class="auth-card">
    <h2>🍔 Créer un compte</h2>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <form th:action="@{/register}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="form-group">
            <label>Nom complet</label>
            <input type="text" name="fullName" required placeholder="Jean Dupont">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required placeholder="votre@email.com">
        </div>
        <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" name="password" required placeholder="Min. 6 caractères" minlength="6">
        </div>
        <div class="form-group">
            <label>Téléphone</label>
            <input type="tel" name="phone" placeholder="+33 6 00 00 00 00">
        </div>
        <div class="form-group">
            <label>Adresse</label>
            <input type="text" name="address" placeholder="123 rue de la Paix, Paris">
        </div>
        <button type="submit" class="btn-primary btn-full">S'inscrire</button>
    </form>
    <p class="auth-link">Déjà inscrit ? <a th:href="@{/login}">Se connecter</a></p>
</div>
</body>
</html>
